name: Example

# This example workflow demonstrates using the action from within this repo.
# It creates a tiny two-go project in a subdirectory, then runs the local
# action (uses: ./) against it with explicit inputs. The sample has no lockfile,
# so it installs with `npm install` instead of the default `npm ci`.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create a minimal two-go sample project
        run: |
          mkdir -p sample
          cat > sample/package.json <<'EOF'
          {
            "name": "sample",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "test": "node --test"
            },
            "dependencies": {
              "two-go": "^2.0.0"
            }
          }
          EOF
          cat > sample/api.test.mjs <<'EOF'
          // Hermetic two-go test: starts a local server so CI needs no network API.
          import { test, before, after } from "node:test";
          import { createServer } from "node:http";
          import { go } from "two-go";

          let server;
          let api;

          before(async () => {
            server = createServer((req, res) => {
              res.setHeader("content-type", "application/json");
              res.end(JSON.stringify({ id: 1, path: req.url }));
            });
            await new Promise((resolve) => server.listen(0, resolve));
            api = go(`http://localhost:${server.address().port}`);
          });

          after(() => server.close());

          test("GET /todos/1 returns JSON", async () => {
            await api
              .get("/todos/1")
              .expectStatus(200)
              .expectHeader("content-type", /json/)
              .expectJson("id", 1)
              .expectJson("path", "/todos/1");
          });
          EOF

      - name: Run two-go action against the sample project
        uses: ./
        with:
          node-version: "20"
          working-directory: sample
          install-command: npm install
          test-command: npm test
